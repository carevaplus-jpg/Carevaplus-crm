<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Lexend; font-weight: 700; src: url(../../node_modules/@fontsource/lexend/files/lexend-latin-700-normal.woff2); }
@font-face { font-family: Lexend; font-weight: 500; src: url(../../node_modules/@fontsource/lexend/files/lexend-latin-500-normal.woff2); }
@font-face { font-family: Inter; font-weight: 100 900; src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2); }
* { margin: 0; box-sizing: border-box; }
body { width: 1024px; height: 500px; overflow: hidden; font-family: Inter, sans-serif; }
.wrap { position: relative; width: 1024px; height: 500px; overflow: hidden;
  background: radial-gradient(120% 140% at 15% 10%, #1b2744 0%, #0b1220 55%, #060a14 100%); }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); }
.b1 { width: 460px; height: 460px; left: -120px; top: -180px; background: #3461ef; opacity: .45; }
.b2 { width: 420px; height: 420px; right: 40px; bottom: -220px; background: #d9b35b; opacity: .35; }
.left { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
.logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #f0d386, #c9a227);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px -12px rgba(201,162,39,.7); }
h1 { font-family: Lexend; font-weight: 700; color: #fff; font-size: 64px; letter-spacing: -1.5px; margin-top: 26px; line-height: 1; }
h1 span { color: #f0d386; }
p.tag { font-family: Lexend; font-weight: 500; color: rgba(255,255,255,.78); font-size: 24px; margin-top: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
.chip { font-size: 15px; font-weight: 600; color: #fff; padding: 7px 14px; border-radius: 999px;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(10px); }
.phone { position: absolute; right: 70px; top: 46px; width: 238px; height: 424px; border-radius: 36px; padding: 9px;
  background: linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.35); box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); transform: rotate(4deg); }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 28px; display: block; }
</style></head>
<body><div class="wrap">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="left">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="#0b1220" stroke="#0b1220" stroke-width="1.6" stroke-linejoin="round"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg></div>
    <h1>Careva<span>+</span> CRM</h1>
    <p class="tag">Your executive sales command centre</p>
    <div class="chips"><span class="chip">Contacts</span><span class="chip">Deal pipeline</span><span class="chip">Quotes &amp; Invoices</span><span class="chip">WhatsApp &amp; SMS</span><span class="chip">Reports</span></div>
  </div>
  <div class="phone"><img src="../screenshots/01-dashboard.png"></div>
</div></body></html>
