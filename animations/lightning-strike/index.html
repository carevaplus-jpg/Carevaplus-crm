<title>Struck by Lightning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap">
<style>
/* Layout: one vertical 9:16 "phone short" stage centred on a dark set, transport controls underneath. */
:root{
  --set:#0b0e13;
  --ink:#e9eef6;
  --muted:#8b95a6;
  --volt:#9fd2ff;
  --cap:#ffd21f;
  --display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--set);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;overflow:hidden}
#stage{position:relative;height:min(84vh,960px);aspect-ratio:9/16;max-width:100%;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);--u:5.4px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
#flash{background:#eaf2ff;opacity:0;mix-blend-mode:screen}
#fade{background:#000;opacity:0}
#cap{position:absolute;left:6%;right:6%;top:64%;text-align:center;font-family:var(--display);font-size:calc(var(--u)*9.2);line-height:1.05;letter-spacing:.01em;text-transform:uppercase;color:#fff;-webkit-text-stroke:calc(var(--u)*.55) #000;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(0,0,0,.6);text-wrap:balance}
#cap span{display:inline-block;margin:0 .12em}
#cap span.on{color:var(--cap);transform:scale(1.12)}
#stat{position:absolute;left:0;right:0;top:4%;text-align:center;font-family:var(--display);opacity:0}
#stat .n{font-size:calc(var(--u)*13);color:#fff;-webkit-text-stroke:calc(var(--u)*.45) #04122a;paint-order:stroke fill;text-shadow:0 0 calc(var(--u)*4) rgba(120,190,255,.9)}
#stat .l{font-family:var(--body);font-weight:700;font-size:calc(var(--u)*3.6);letter-spacing:.32em;color:var(--volt);margin-top:calc(var(--u)*.6)}
#tag{position:absolute;left:50%;top:7%;transform:translateX(-50%);padding:calc(var(--u)*1) calc(var(--u)*2.4);border-radius:999px;background:rgba(10,14,22,.72);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:calc(var(--u)*3.1);letter-spacing:.18em;white-space:nowrap;opacity:0;color:#fff}
#tag i{font-style:normal;color:#ff6d7a}
#hud{opacity:0}
#end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);opacity:0;text-align:center}
#end .a{font-family:var(--display);font-size:calc(var(--u)*11);line-height:.95;color:#fff;text-transform:uppercase}
#end .a b{color:var(--cap);font-weight:400}
#end .b{font-size:calc(var(--u)*3);letter-spacing:.3em;color:var(--volt);font-weight:700}
#bigplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:0;cursor:pointer;color:#fff;font-family:var(--body)}
#bigplay span{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-weight:700;font-size:16px;letter-spacing:.08em}
#bigplay svg{width:18px;height:18px;fill:currentColor}
#loading{position:absolute;left:0;right:0;bottom:8%;text-align:center;font:700 12px/1 var(--body);letter-spacing:.2em;color:var(--muted)}
#bar{display:flex;align-items:center;gap:10px;width:min(100%,520px)}
#bar button{flex:none;height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);font:700 12px/1 var(--body);letter-spacing:.06em;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar button:focus-visible,#seek:focus-visible,#bigplay:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
#seek{flex:1;min-width:0;accent-color:var(--volt)}
#time{flex:none;font:500 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;width:76px;text-align:right}
body.capture{padding:0;background:#000}
body.capture #stage{height:960px;width:540px;max-width:none;border-radius:0;box-shadow:none}
body.capture #bar,body.capture #bigplay,body.capture #loading{display:none}
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud" class="ov"></canvas>
  <div id="flash" class="ov"></div>
  <div id="stat"><div class="n"></div><div class="l"></div></div>
  <div id="tag"></div>
  <div id="cap"></div>
  <div id="end" class="ov"><div class="a">Stay low.<br><b>Get inside.</b></div><div class="b">WHEN THUNDER ROARS</div></div>
  <div id="fade" class="ov"></div>
  <button id="bigplay" type="button" aria-label="Play with sound" hidden><span><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>PLAY WITH SOUND</span></button>
  <div id="loading">SCULPTING CHARACTER…</div>
</div>
<div id="bar">
  <button id="play" type="button">PLAY</button>
  <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Timeline">
  <span id="time">0.0 / 30.0</span>
  <button id="snd" type="button" aria-pressed="true">SOUND ON</button>
</div>

const smin=(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;};

function sdEll(x,y,z,cx,cy,cz,rx,ry,rz){const px=(x-cx)/rx,py=(y-cy)/ry,pz=(z-cz)/rz;const k0=Math.sqrt(px*px+py*py+pz*pz);const k1=Math.sqrt(px*px/(rx*rx)+py*py/(ry*ry)+pz*pz/(rz*rz));return k0*(k0-1)/(k1||1e-6);}
function sdCone(x,y,z,a,b,r1,r2){const bx=b[0]-a[0],by=b[1]-a[1],bz=b[2]-a[2];const px=x-a[0],py=y-a[1],pz=z-a[2];
  const t=clamp((px*bx+py*by+pz*bz)/(bx*bx+by*by+bz*bz));const dx=px-bx*t,dy=py-by*t,dz=pz-bz*t;return Math.sqrt(dx*dx+dy*dy+dz*dz)-lerp(r1,r2,t);}
function surfaceNets(sdf,mn,mx,h){
  const nx=Math.ceil((mx[0]-mn[0])/h)+1,ny=Math.ceil((mx[1]-mn[1])/h)+1,nz=Math.ceil((mx[2]-mn[2])/h)+1;
  const F=new Float32Array(nx*ny*nz);
  for(let k=0;k<nz;k++)for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)F[i+nx*(j+ny*k)]=sdf(mn[0]+i*h,mn[1]+j*h,mn[2]+k*h);
  const cid=(i,j,k)=>i+(nx-1)*(j+(ny-1)*k);
  const cellV=new Int32Array((nx-1)*(ny-1)*(nz-1)).fill(-1);

  for(let k=0;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){

    if(m===0||m===255)continue;
    let sx=0,sy=0,sz=0,n=0;
    for(const[a,b]of E){const va=val[a],vb=val[b];if((va<0)===(vb<0))continue;const t=va/(va-vb);
      sx+=(a&1)+((b&1)-(a&1))*t;sy+=((a>>1)&1)+(((b>>1)&1)-((a>>1)&1))*t;sz+=((a>>2)&1)+(((b>>2)&1)-((a>>2)&1))*t;n++;}
    cellV[cid(i,j,k)]=pos.length/3;
    pos.push(mn[0]+(i+sx/n)*h,mn[1]+(j+sy/n)*h,mn[2]+(k+sz/n)*h);
  }
  const idx=[];
  const quad=(a,b,c,d)=>{if(a<0||b<0||c<0||d<0)return;idx.push(a,b,c,a,c,d);};
  for(let k=1;k<nz-1;k++)for(let j=1;j<ny-1;j++)for(let i=1;i<nx-1;i++){
    const in0=F[i+nx*(j+ny*k)]<0;
    if(in0!==(F[i+1+nx*(j+ny*k)]<0))quad(cellV[cid(i,j-1,k-1)],cellV[cid(i,j,k-1)],cellV[cid(i,j,k)],cellV[cid(i,j-1,k)]);
    if(in0!==(F[i+nx*(j+1+ny*k)]<0))quad(cellV[cid(i-1,j,k-1)],cellV[cid(i-1,j,k)],cellV[cid(i,j,k)],cellV[cid(i,j,k-1)]);
    if(in0!==(F[i+nx*(j+ny*(k+1))]<0))quad(cellV[cid(i-1,j-1,k)],cellV[cid(i,j-1,k)],cellV[cid(i,j,k)],cellV[cid(i-1,j,k)]);
  }
  const P=new Float32Array(pos),N=new Float32Array(pos.length),e=h*.5;
  for(let v=0;v<P.length;v+=3){
    for(let it=0;it<2;it++){const x=P[v],y=P[v+1],z=P[v+2];
      let gx=sdf(x+e,y,z)-sdf(x-e,y,z),gy=sdf(x,y+e,z)-sdf(x,y-e,z),gz=sdf(x,y,z+e)-sdf(x,y,z-e);const l=Math.hypot(gx,gy,gz)||1;gx/=l;gy/=l;gz/=l;
      const d=sdf(x,y,z);P[v]-=gx*d;P[v+1]-=gy*d;P[v+2]-=gz*d;N[v]=gx;N[v+1]=gy;N[v+2]=gz;}
  }
  for(let t=0;t<idx.length;t+=3){const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
    const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],wx=P[c]-P[a],wy=P[c+1]-P[a+1],wz=P[c+2]-P[a+2];
    const cx=uy*wz-uz*wy,cy=uz*wx-ux*wz,cz=ux*wy-uy*wx;
    if(cx*(N[a]+N[b]+N[c])+cy*(N[a+1]+N[b+1]+N[c+1])+cz*(N[a+2]+N[b+2]+N[c+2])<0){const s=idx[t+1];idx[t+1]=idx[t+2];idx[t+2]=s;}}

}

  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uGrain,uVig,uCA;varying vec2 vUv;
  float rnd(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec2 d=vUv-.5;float r=length(d*vec2(.5625,1.));
    vec3 c;c.r=texture2D(tDiffuse,vUv-d*uCA*r).r;c.g=texture2D(tDiffuse,vUv).g;c.b=texture2D(tDiffuse,vUv+d*uCA*r).b;

  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vDir;uniform float uTime,uFlash,uDim;

  float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<7;i++){s+=a*n2(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
  void main(){vec3 d=normalize(vDir);float h=d.y;
    vec3 base=mix(vec3(.13,.155,.19),vec3(.03,.035,.05),smoothstep(0.,.6,h));
    vec2 uv=d.xz/(max(h,0.)+.18)*.9+vec2(uTime*.035,uTime*.01);
    float c=fbm(uv),c2=fbm(uv*2.3+3.),c3=fbm(uv*.5-uTime*.01);

    #include <tonemapping_fragment>

  }`
}));

/* ---------- ground, grass, trees ---------- */
const groundTex=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');const r=rng(21);

  for(let i=0;i<60;i++){x.fillStyle=`rgba(20,22,16,${.15+r()*.2})`;x.beginPath();x.ellipse(r()*512,r()*512,8+r()*30,5+r()*18,r()*3,0,7);x.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(40,40);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;})();

{

const lichSegs=[];let lichMax=0;

    for(let i=0;i<130&&w>.9&&lichSegs.length<budget;i++){

      if(r()<.16&&depth<5)grow(x,y,ang+(r()<.5?-1:1)*(.6+r()*.8),w*.68,dist,depth+1);

  let acc=a;const timed=words.map((w,i)=>{const s=acc;acc+=(b-a)*wl[i]/tot;return{w,s,e:acc};});
  for(let i=0;i<timed.length;){let n=3;if(timed.length-i===4)n=2;const ch=timed.slice(i,i+n);CHUNKS.push({words:ch,s:ch[0].s,e:ch[ch.length-1].e});i+=n;}
});

function updateCaption(t){
  const c=CHUNKS.find((c,i)=>t>=c.s&&(t<(CHUNKS[i+1]?CHUNKS[i+1].s:c.e+.4))&&t<c.e+.4);
  const el=$('cap');

/* ---------- ECG HUD ---------- */
function ecgAt(t){
  const g=(x,m,s)=>Math.exp(-((x-m)*(x-m))/(2*s*s));
  const beat=ph=>.12*g(ph,.18,.025)-.12*g(ph,.3,.012)+1.0*g(ph,.33,.012)-.25*g(ph,.36,.012)+.25*g(ph,.6,.045);
  if(t<12.6)return beat((t*1.75)%1);
  if(t<14.4){const k=1-seg(t,13.9,14.4);return k*(.35*Math.sin(t*41)+.25*Math.sin(t*67+1)+.15*Math.sin(t*23));}
  if(t<22.8)return .01*Math.sin(t*30);
  return beat(((t-22.8)*1.25+.1)%1);
}
function drawHud(t,vis){
  const hud=$('hud');const x=hud.getContext('2d');const Wd=hud.width,H=hud.height,u=Wd/100;
  x.clearRect(0,0,Wd,H);hud.style.opacity=vis;if(vis<=0)return;
  const bx=6*u,by=H-30*u,bw=Wd-12*u,bh=16*u;
  x.fillStyle='rgba(4,10,8,.62)';x.strokeStyle='rgba(120,255,170,.35)';x.lineWidth=u*.25;
  x.beginPath();x.roundRect(bx,by,bw,bh,2*u);x.fill();x.stroke();
  x.strokeStyle='rgba(120,255,170,.12)';x.lineWidth=1;
  for(let i=1;i<10;i++){x.beginPath();x.moveTo(bx+bw*i/10,by);x.lineTo(bx+bw*i/10,by+bh);x.stroke();}
  const span=2.6,flat=t>=14.4&&t<22.8;
  x.strokeStyle=flat?'#ff4d5e':'#6dff9e';x.lineWidth=u*.45;x.shadowColor=x.strokeStyle;x.shadowBlur=u*1.5;x.beginPath();
  for(let i=0;i<=240;i++){const tt=t-span+span*i/240;const v=ecgAt(tt);const px=bx+bw*i/240,py=by+bh*.62-v*bh*.42;i?x.lineTo(px,py):x.moveTo(px,py);}
  x.stroke();x.shadowBlur=0;
  const label=t<12.6?'96 BPM':t<14.4?'V-FIB':t<22.8?'0 BPM':'72 BPM';
  x.fillStyle=flat||(t>=12.6&&t<14.4)?'#ff6d7a':'#6dff9e';x.font=`700 ${3*u}px Archivo, Arial, sans-serif`;
  x.fillText('♥ '+label,bx+2*u,by+4.2*u);
}

  else if(t<16){const k=ease(seg(t,11,16));tgt=HEART_W.clone();pos=HEART_W.clone().add(V(lerp(.32,.1,k),lerp(.1,.03,k),lerp(.75,.33,k)));fov=36;ap=.006;}
  else if(t<20.5){const k=ease(seg(t,16,20.5));const el=arms[1].el.getWorldPosition(V()),wr=arms[1].wr.getWorldPosition(V());
    const mid=el.clone().lerp(wr,lerp(.3,.55,k));tgt=mid;pos=mid.clone().add(V(lerp(.42,.3,k),lerp(.12,.05,k),lerp(.62,.46,k)));fov=34;ap=.008;}
  else if(t<25.4){const k=ease(seg(t,20.5,25.4));pos=V(lerp(-.35,.25,k),lerp(1.72,1.76,k),lerp(1.45,1.0,k));tgt=V(0,lerp(1.66,1.72,k),0);fov=36;ap=.005;}
  else{const k=ease(seg(t,25.4,30));pos=V(lerp(2.2,3.6,k),lerp(.95,1.6,k),lerp(3.0,4.8,k));tgt=V(lerp(0,-.7,k),lerp(.5,.9,k),lerp(0,-1,k));fov=lerp(42,50,k);ap=.0015;}

  $('flash').style.opacity=clamp(fl*.3,0,.55);

  else if(t>=4.33&&t<4.42){bolts[2].visible=true;revealBolt(bolts[2],1);}
  farBolts.forEach(b=>b.visible=false);
  if(t>=27.1&&t<27.3){farBolts[0].visible=true;revealBolt(farBolts[0],seg(t,27.1,27.2));}
  else if(t>=27.36&&t<27.46){farBolts[1].visible=true;revealBolt(farBolts[1],1);}

  if(t>=4&&t<5){sweep=lerp(2.1,-.2,seg(t,4,4.5));amp=.5*(1-seg(t,4.3,5));}

  shellMat.uniforms.uSweep.value=sweep;shellMat.uniforms.uAmp.value=amp;
  shell.visible=amp>0&&!xray;

    const on=k>0;c.core.visible=c.glow.visible=on;
    if(on){const fk=t>11?.35+.3*Math.abs(Math.sin(t*37)):1;
      c.core.geometry.setDrawRange(0,Math.floor(c.core.userData.full*k/3)*3);c.glow.geometry.setDrawRange(0,Math.floor(c.glow.userData.full*k/3)*3);
      c.core.material.opacity=fk;c.glow.material.opacity=.45*fk;}});
  pulses.forEach(p=>{const on=xray&&t>8.2&&t<11.4;p.sp.visible=on;if(on){p.sp.position.copy(p.c.getPointAt((t*1.6+p.off)%1));p.sp.material.opacity=clamp((11.4-t)*3);}});

  let hs=1,he=1.2;
  if(t<12.6){const ph=(t*1.75)%1;hs=1+.16*Math.exp(-Math.pow((ph-.3)/.06,2));}
  else if(t<14.4){hs=1+.05*Math.sin(t*41)+.04*Math.sin(t*67);he=1.2-.4*seg(t,13.6,14.4);}
  else if(t<22.8){hs=.97;he=.12;}
  else{const ph=((t-22.8)*1.25+.1)%1;hs=1+.14*Math.exp(-Math.pow((ph-.3)/.06,2));he=1.1;}
  heart.scale.setScalar(.85*hs);heartMat.emissiveIntensity=he*.7;
  heartGlow.position.copy(J.heartP.getWorldPosition(V()));heartGlow.material.opacity=clamp(he/1.2)*.55;
  xrayL.position.copy(heartGlow.position);xrayL.intensity=xray?he*.25:0;

  drawLich(t<16.2?0:clamp(eo(seg(t,16.3,19.8))));

  const c=cam(t);camera.position.copy(c.pos);camera.lookAt(c.tgt);camera.fov=c.fov;camera.updateProjectionMatrix();
  bokeh.uniforms.focus.value=c.pos.distanceTo(c.tgt);bokeh.uniforms.aperture.value=c.ap;bokeh.uniforms.maxblur.value=.012;
  bloom.strength=(t>=11&&t<16)?.45:xray?.8:.5+fl*.3;
  updateRain(t);rain.visible=!(t>=11&&t<20.5);
  splashes.forEach(s=>{const k=(t*s.userData.sp+s.userData.o)%1;s.scale.setScalar(.01+k*.05);s.material.opacity=(1-k)*.35*(rain.visible?1:0);});

  composer.render();

  updateCaption(t);
  const st=$('stat');let sv=0;
  if(t>=6.6&&t<10.9){sv=win(t,6.6,10.9,.25);const k=eo(seg(t,6.6,8.6));st.querySelector('.n').textContent=Math.round(300000000*k).toLocaleString('en-US');st.querySelector('.l').textContent='VOLTS';}
  else if(t>=22.9&&t<25.3){sv=win(t,22.9,25.3,.25);st.querySelector('.n').textContent=Math.round(90*eo(seg(t,22.9,23.9)))+'%';st.querySelector('.l').textContent='SURVIVE';}
  st.style.opacity=sv;st.style.transform=`scale(${.92+.08*eo(clamp(sv))})`;
  const tag=$('tag');let tv=0;
  if(t>=16.6&&t<20.4){tv=win(t,16.6,20.4,.25);tag.innerHTML='LICHTENBERG <i>FIGURE</i>';}
  else if(t>=20.8&&t<22.8){tv=win(t,20.8,22.8,.25);tag.innerHTML='<i>FLASH</i>OVER';}
  else if(t>=26.6&&t<29.1){tv=win(t,26.6,29.1,.25);tag.innerHTML='FEET TOGETHER · <i>HEAD DOWN</i>';}
  tag.style.opacity=tv;
  drawHud(t,Math.max(win(t,11.4,15.9,.25),win(t,21.6,25.3,.25)));
  $('end').style.opacity=seg(t,29.2,29.6);
  $('fade').style.opacity=t>29.15?.35*seg(t,29.15,29.5):0;
}

/* ---------- audio (live AudioContext and OfflineAudioContext) ---------- */
function noiseBuf(ctx,sec,brown){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0;const r=rng(17+ch);
    for(let i=0;i<n;i++){const w=r()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}}return b;}
function scheduleAudio(ctx,dest,from,base){
  const at=T=>base+Math.max(0,T-from);const end=at(DUR);
  const Wn=noiseBuf(ctx,4,false),B=noiseBuf(ctx,4,true);
  const src=(buf,loop=true)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=loop;return s;};
  const filt=(type,f,q=.7)=>{const x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q;return x;};
  const gain=v=>{const g=ctx.createGain();g.gain.value=v;return g;};
  {const s=src(Wn),bp=filt('lowpass',5200),hp=filt('highpass',700),g=gain(0);s.connect(hp).connect(bp).connect(g).connect(dest);
   const lvl=T=>(T>=6&&T<20.5)?.03:.16;
   g.gain.setValueAtTime(lvl(from)*(from<.5?0:1),at(from));if(from<.5)g.gain.linearRampToValueAtTime(.16,at(.6));
   [6,20.5].forEach(T=>{if(T>from){g.gain.setValueAtTime(lvl(T-.01),at(T));g.gain.linearRampToValueAtTime(lvl(T+.01),at(T)+.25);}});
   g.gain.setValueAtTime(lvl(29),at(29.2));g.gain.linearRampToValueAtTime(0,end);s.start(base);s.stop(end+.1);}
  {const s=src(B),lp=filt('lowpass',140),g=gain(.5);s.connect(lp).connect(g).connect(dest);g.gain.setValueAtTime(.5,at(29.3));g.gain.linearRampToValueAtTime(0,end);s.start(base);s.stop(end+.1);}
  const burst=(T,dur,peak,lpF,decay)=>{if(T+dur<from)return;const s=src(Wn,false),lp=filt('lowpass',lpF),g=gain(0);s.connect(lp).connect(g).connect(dest);
    const t0=at(T);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+.008);g.gain.exponentialRampToValueAtTime(.0005,t0+decay);s.start(t0);s.stop(t0+dur);};
  const rumble=(T,peak,dur)=>{if(T+dur<from)return;const s=src(B),lp=filt('lowpass',220),g=gain(0);s.connect(lp).connect(g).connect(dest);const t0=at(T);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+.15);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.start(t0);s.stop(t0+dur+.1);};
  rumble(2.1,.9,2.2);
  burst(4.0,.5,1.4,9000,.35);burst(4.2,.4,.9,6000,.3);rumble(4.05,2.4,4.5);
  burst(27.45,.4,.35,2500,.4);rumble(27.5,1.4,2.8);
  if(10.8>from){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=gain(0),lp=filt('lowpass',1400);o.type='sawtooth';o.frequency.value=60;o2.type='square';o2.frequency.value=120;
    o.connect(lp);o2.connect(lp);lp.connect(g).connect(dest);g.gain.setValueAtTime(0,at(Math.max(from,6.1)));g.gain.linearRampToValueAtTime(.05,at(6.4));g.gain.setValueAtTime(.05,at(10.4));g.gain.linearRampToValueAtTime(0,at(10.9));
    o.start(at(6));o2.start(at(6));o.stop(at(11));o2.stop(at(11));}
  {const r=rng(5);for(let T=6.2;T<10.8;T+=.04+r()*.09){if(T>from)burst(T,.06,.18+r()*.3,8000,.04+r()*.05);}}
  {const r=rng(8);for(let T=16.4;T<19.8;T+=.08+r()*.18){if(T>from)burst(T,.05,.05+r()*.08,11000,.03);}}
  CUTS.forEach(T=>{if(T-.35<from)return;const s=src(Wn,false),bp=filt('bandpass',400,1.2),g=gain(0);s.connect(bp).connect(g).connect(dest);const t0=at(T-.35);
    bp.frequency.setValueAtTime(300,t0);bp.frequency.exponentialRampToValueAtTime(3500,t0+.35);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.35,t0+.3);g.gain.exponentialRampToValueAtTime(.001,t0+.6);s.start(t0);s.stop(t0+.7);});
  const thump=(T,v)=>{if(T<from)return;const o=ctx.createOscillator(),g=gain(0);o.frequency.setValueAtTime(70,at(T));o.frequency.exponentialRampToValueAtTime(38,at(T)+.12);
    o.connect(g).connect(dest);g.gain.setValueAtTime(0,at(T));g.gain.linearRampToValueAtTime(v,at(T)+.01);g.gain.exponentialRampToValueAtTime(.001,at(T)+.18);o.start(at(T));o.stop(at(T)+.2);};
  const beep=(T,d,v=.06)=>{if(T+d<from)return;const o=ctx.createOscillator(),g=gain(0);o.type='sine';o.frequency.value=988;o.connect(g).connect(dest);
    const t0=at(T);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.setValueAtTime(v,t0+d-.02);g.gain.linearRampToValueAtTime(0,t0+d);o.start(t0);o.stop(t0+d+.02);};
  for(let k=0;;k++){const T=(k+.3)/1.75;if(T>12.6)break;if(T>11){thump(T,.9);thump(T+.16,.55);beep(T+.02,.09);}}
  for(let T=12.65;T<14.3;T+=.11)thump(T,.25);
  beep(14.45,1.6,.05);
  for(let k=0;;k++){const T=22.8+(k+.2)/1.25;if(T>25.4)break;thump(T,.8);thump(T+.16,.5);beep(T+.02,.09);}
  if(29.2>from){const o=ctx.createOscillator(),g=gain(0);o.frequency.setValueAtTime(90,at(29.2));o.frequency.exponentialRampToValueAtTime(30,at(29.2)+1);o.connect(g).connect(dest);
    g.gain.setValueAtTime(0,at(29.2));g.gain.linearRampToValueAtTime(.8,at(29.21));g.gain.exponentialRampToValueAtTime(.001,at(29.95));o.start(at(29.2));o.stop(end);}
}

/* ---------- narration: embedded voice track ---------- */
let voiceBuf=null;
try{const b64=$('voice').textContent.trim();const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  if(!CAPTURE)new OfflineAudioContext(1,22050,22050).decodeAudioData(u8.buffer).then(b=>voiceBuf=b).catch(()=>{});}catch(e){}

/* ---------- playback ---------- */
let t=0,playing=false,last=0,soundOn=true,actx=null,bus=null,spokeIdx=-1;
const playBtn=$('play'),seek=$('seek'),timeEl=$('time'),snd=$('snd'),big=$('bigplay');
function stopAudio(){if(bus){try{bus.disconnect();}catch(e){}bus=null;}try{speechSynthesis.cancel();}catch(e){}}
function startAudio(){
  stopAudio();if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();
    bus=actx.createGain();bus.gain.value=.8;bus.connect(actx.destination);
    scheduleAudio(actx,bus,t,actx.currentTime+.05);
    if(voiceBuf){const s=actx.createBufferSource();s.buffer=voiceBuf;const g=actx.createGain();g.gain.value=1.6;s.connect(g).connect(bus);s.start(actx.currentTime+.05,t);}
  }catch(e){}
  spokeIdx=LINES.findIndex(l=>l[0]>=t)-1;
}
function speak(i){
  if(voiceBuf||!soundOn||!('speechSynthesis' in window))return;
  try{const u=new SpeechSynthesisUtterance(LINES[i][2]);u.rate=1.12;u.pitch=.95;speechSynthesis.speak(u);}catch(e){}
}
function setPlaying(p){
  playing=p;playBtn.textContent=p?'PAUSE':(t>=DUR?'REPLAY':'PLAY');big.hidden=true;
  if(p){if(t>=DUR)t=0;last=performance.now();startAudio();}else stopAudio();
}
playBtn.onclick=()=>setPlaying(!playing);
big.onclick=()=>{soundOn=true;snd.textContent='SOUND ON';snd.setAttribute('aria-pressed','true');setPlaying(true);};
snd.onclick=()=>{soundOn=!soundOn;snd.textContent=soundOn?'SOUND ON':'SOUND OFF';snd.setAttribute('aria-pressed',String(soundOn));if(playing)startAudio();};
seek.oninput=()=>{t=+seek.value;if(playing)startAudio();renderAt(t);};
function loop(now){
  if(playing){t+=Math.min(.1,(now-last)/1000);last=now;
    const li=LINES.findIndex((l,i)=>i>spokeIdx&&t>=l[0]);if(li>=0&&li>spokeIdx){spokeIdx=li;speak(li);}
    if(t>=DUR){t=DUR;setPlaying(false);}}
  else last=now;
  renderAt(t);seek.value=t;timeEl.textContent=t.toFixed(1)+' / 30.0';
  requestAnimationFrame(loop);
}

/* ---------- capture hooks (used to render the MP4) ---------- */
window.__render=s=>{renderAt(s);return true;};
window.__renderAudio=async()=>{
  const sr=44100,ctx=new OfflineAudioContext(2,sr*DUR,sr);
  const b=ctx.createGain();b.gain.value=.8;b.connect(ctx.destination);
  scheduleAudio(ctx,b,0,0);
  const buf=await ctx.startRendering();
  const n=buf.length,out=new DataView(new ArrayBuffer(44+n*4));
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');out.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,2,true);
  out.setUint32(24,sr,true);out.setUint32(28,sr*4,true);out.setUint16(32,4,true);out.setUint16(34,16,true);ws(36,'data');out.setUint32(40,n*4,true);
  const L=buf.getChannelData(0),R=buf.getChannelData(1);
  for(let i=0;i<n;i++){out.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);out.setInt16(46+i*4,clamp(R[i],-1,1)*32767,true);}
  let s='';const u8=new Uint8Array(out.buffer);for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
  return btoa(s);
};

resize();addEventListener('resize',resize);
renderAt(0);
$('loading').hidden=true;big.hidden=CAPTURE;
window.__ready=true;
if(!CAPTURE)requestAnimationFrame(loop);
</script>
