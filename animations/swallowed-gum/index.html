<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const DUR=30;
const CAPTURE=/capture/.test(location.search);
if(CAPTURE)document.body.classList.add('capture');
const $=id=>document.getElementById(id);
const stage=$('stage');

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eo=k=>1-Math.pow(1-k,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const win=(t,a,b,f=.3)=>clamp((t-a)/f)*clamp((b-t)/f);
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;}}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- SDF toolkit + surface-nets mesher ---------- */
const smin=(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;};
const smax=(a,b,k)=>-smin(-a,-b,k);
function sdEll(x,y,z,cx,cy,cz,rx,ry,rz){const px=(x-cx)/rx,py=(y-cy)/ry,pz=(z-cz)/rz;const k0=Math.sqrt(px*px+py*py+pz*pz);const k1=Math.sqrt(px*px/(rx*rx)+py*py/(ry*ry)+pz*pz/(rz*rz));return k0*(k0-1)/(k1||1e-6);}
function sdCone(x,y,z,a,b,r1,r2){const bx=b[0]-a[0],by=b[1]-a[1],bz=b[2]-a[2];const px=x-a[0],py=y-a[1],pz=z-a[2];
  const t=clamp((px*bx+py*by+pz*bz)/(bx*bx+by*by+bz*bz));const dx=px-bx*t,dy=py-by*t,dz=pz-bz*t;return Math.sqrt(dx*dx+dy*dy+dz*dz)-lerp(r1,r2,t);}
function surfaceNets(sdf,mn,mx,h){
  const nx=Math.ceil((mx[0]-mn[0])/h)+1,ny=Math.ceil((mx[1]-mn[1])/h)+1,nz=Math.ceil((mx[2]-mn[2])/h)+1;
  const F=new Float32Array(nx*ny*nz);
  for(let k=0;k<nz;k++)for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)F[i+nx*(j+ny*k)]=sdf(mn[0]+i*h,mn[1]+j*h,mn[2]+k*h);
  const cid=(i,j,k)=>i+(nx-1)*(j+(ny-1)*k);
  const cellV=new Int32Array((nx-1)*(ny-1)*(nz-1)).fill(-1);
  const pos=[];
  const E=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const val=new Float32Array(8);
  for(let k=0;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    let m=0;
    for(let c=0;c<8;c++){const v=F[(i+(c&1))+nx*((j+((c>>1)&1))+ny*(k+((c>>2)&1)))];val[c]=v;if(v<0)m|=1<<c;}
    if(m===0||m===255)continue;
    let sx=0,sy=0,sz=0,n=0;
    for(const[a,b]of E){const va=val[a],vb=val[b];if((va<0)===(vb<0))continue;const t=va/(va-vb);
      sx+=(a&1)+((b&1)-(a&1))*t;sy+=((a>>1)&1)+(((b>>1)&1)-((a>>1)&1))*t;sz+=((a>>2)&1)+(((b>>2)&1)-((a>>2)&1))*t;n++;}
    cellV[cid(i,j,k)]=pos.length/3;
    pos.push(mn[0]+(i+sx/n)*h,mn[1]+(j+sy/n)*h,mn[2]+(k+sz/n)*h);
  }
  const idx=[];
  const quad=(a,b,c,d)=>{if(a<0||b<0||c<0||d<0)return;idx.push(a,b,c,a,c,d);};
  for(let k=1;k<nz-1;k++)for(let j=1;j<ny-1;j++)for(let i=1;i<nx-1;i++){
    const in0=F[i+nx*(j+ny*k)]<0;
    if(in0!==(F[i+1+nx*(j+ny*k)]<0))quad(cellV[cid(i,j-1,k-1)],cellV[cid(i,j,k-1)],cellV[cid(i,j,k)],cellV[cid(i,j-1,k)]);
    if(in0!==(F[i+nx*(j+1+ny*k)]<0))quad(cellV[cid(i-1,j,k-1)],cellV[cid(i-1,j,k)],cellV[cid(i,j,k)],cellV[cid(i,j,k-1)]);
    if(in0!==(F[i+nx*(j+ny*(k+1))]<0))quad(cellV[cid(i-1,j-1,k)],cellV[cid(i,j-1,k)],cellV[cid(i,j,k)],cellV[cid(i-1,j,k)]);
  }
  const P=new Float32Array(pos),N=new Float32Array(pos.length),e=h*.5;
  for(let v=0;v<P.length;v+=3){
    for(let it=0;it<2;it++){const x=P[v],y=P[v+1],z=P[v+2];
      let gx=sdf(x+e,y,z)-sdf(x-e,y,z),gy=sdf(x,y+e,z)-sdf(x,y-e,z),gz=sdf(x,y,z+e)-sdf(x,y,z-e);const l=Math.hypot(gx,gy,gz)||1;gx/=l;gy/=l;gz/=l;
      const d=sdf(x,y,z);P[v]-=gx*d;P[v+1]-=gy*d;P[v+2]-=gz*d;N[v]=gx;N[v+1]=gy;N[v+2]=gz;}
  }
  for(let t=0;t<idx.length;t+=3){const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;
    const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],wx=P[c]-P[a],wy=P[c+1]-P[a+1],wz=P[c+2]-P[a+2];
    const cx=uy*wz-uz*wy,cy=uz*wx-ux*wz,cz=ux*wy-uy*wx;
    if(cx*(N[a]+N[b]+N[c])+cy*(N[a+1]+N[b+1]+N[c+1])+cz*(N[a+2]+N[b+2]+N[c+2])<0){const s=idx[t+1];idx[t+1]=idx[t+2];idx[t+2]=s;}}
  return{P,N,idx};
}
const noise3=(x,y,z)=>Math.sin(x*1.7+Math.sin(y*2.3+z*1.1))*Math.sin(y*1.9+Math.sin(z*2.7+x*.7))*Math.sin(z*2.1+Math.sin(x*1.3+y*.9));

/* ---------- renderer + post ---------- */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:CAPTURE});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(40,9/16,0.01,900);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bokeh=new BokehPass(scene,camera,{focus:3,aperture:.002,maxblur:.008});
composer.addPass(bokeh);
const bloom=new UnrealBloomPass(new THREE.Vector2(540,960),.55,.45,.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const filmPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uGrain:{value:.035},uVig:{value:.42},uCA:{value:.004}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uGrain,uVig,uCA;varying vec2 vUv;
  float rnd(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec2 d=vUv-.5;float r=length(d*vec2(.5625,1.));
    vec3 c;c.r=texture2D(tDiffuse,vUv-d*uCA*r).r;c.g=texture2D(tDiffuse,vUv).g;c.b=texture2D(tDiffuse,vUv+d*uCA*r).b;
    float l=dot(c,vec3(.299,.587,.114));
    c=mix(c,c*vec3(.94,1.0,1.05),(1.-smoothstep(.0,.55,l))*.5);
    c=mix(c,c*vec3(1.06,1.0,.92),smoothstep(.45,1.,l)*.5);
    c=(c-.5)*1.06+.5;
    c*=1.-uVig*smoothstep(.2,.75,r);
    c+=(rnd(vUv*vec2(1080.,1920.)+fract(uTime*7.13))-.5)*uGrain;
    gl_FragColor=vec4(c,1.);}`
});
composer.addPass(filmPass);

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight,dpr=CAPTURE?2:Math.min(devicePixelRatio||1,1.5);
  renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);
  composer.setPixelRatio(dpr);composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  stage.style.setProperty('--u',(w/100)+'px');
  const hud=$('hud');hud.width=w*dpr;hud.height=h*dpr;
}

/* ---------- fresnel material (x-ray + flashover); works on skinned and plain meshes ---------- */
function fresnelMat(color,base,power,inflate=0){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uColor:{value:new THREE.Color(color)},uBase:{value:base},uPow:{value:power},uSweep:{value:-9},uAmp:{value:1},uTime:{value:0},uInflate:{value:inflate}},
    vertexShader:`#include <common>
      #include <skinning_pars_vertex>
      uniform float uInflate;varying vec3 vN,vV;varying float vY;
      void main(){
        #include <beginnormal_vertex>
        #include <skinbase_vertex>
        #include <skinnormal_vertex>
        #include <begin_vertex>
        #include <skinning_vertex>
        transformed+=normalize(objectNormal)*uInflate;
        vec4 w=modelMatrix*vec4(transformed,1.);vY=w.y;vec4 mv=viewMatrix*w;
        vN=normalize(normalMatrix*objectNormal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform vec3 uColor;uniform float uBase,uPow,uSweep,uAmp,uTime;varying vec3 vN,vV;varying float vY;
      void main(){float fr=pow(1.-abs(dot(normalize(vN),normalize(vV))),uPow);
      float band=exp(-pow((vY-uSweep)*5.,2.));
      float fl=.75+.25*sin(vY*90.+uTime*70.);
      float a=(uBase+fr)*uAmp+band*1.6*fl*step(.001,uAmp);
      gl_FragColor=vec4(uColor*a,1.);}`
  });
}
const xrayMat=fresnelMat(0x58b6ff,.025,2.4);
const shellMat=fresnelMat(0x9fd8ff,0,2.5,.012);shellMat.uniforms.uAmp.value=0;

/* ---------- character: skeleton (rest = A-pose) ---------- */
const A=.42;
const dA=[Math.sin(A),-Math.cos(A)];
const human=new THREE.Group();scene.add(human);
const J={},bonesL=[];
const bone=(parent,x,y,z,name)=>{const b=new THREE.Bone();b.name=name;b.position.set(x,y,z);parent.add(b);bonesL.push(b);return b;};
J.hips=bone(human,0,.95,0,'hips');
J.spine=bone(J.hips,0,.03,0,'spine');
J.head=bone(J.spine,0,.71,0,'head');
const arms={},legs={};
for(const s of[1,-1]){
  const sh=bone(J.spine,s*.2,.53,0,'sh'+s);
  const el=bone(sh,s*dA[0]*.28,dA[1]*.28,0,'el'+s);
  const wr=bone(el,s*dA[0]*.26,dA[1]*.26,0,'wr'+s);
  arms[s]={sh,el,wr};
  const hp=bone(J.hips,s*.098,-.05,0,'hp'+s);
  const kn=bone(hp,0,-.43,0,'kn'+s);
  const an=bone(kn,0,-.41,0,'an'+s);
  legs[s]={hp,kn,an};
}
human.updateMatrixWorld(true);
const RP={};bonesL.forEach(b=>RP[b.name]=b.getWorldPosition(V()).toArray());
const armPt=(s,d)=>[s*(.2+dA[0]*d),1.51+dA[1]*d,0];

/* ---------- character: body SDF (rest A-pose, metres, facing +z) ---------- */
function bodySDF(x,y,z){
  let d=1e9;const ax=Math.abs(x),sx=x<0?-1:1;
  if(y>.72&&y<1.62&&ax<.32){
    d=sdEll(x,y,z,0,1.35,-.005,.165,.19,.105);
    d=smin(d,sdEll(x,y,z,0,1.15,.005,.145,.17,.098),.06);
    d=smin(d,sdEll(x,y,z,0,.96,-.005,.16,.13,.105),.06);
    d=smin(d,sdEll(ax,y,z,.07,1.38,.04,.075,.055,.045),.04);
    d=smin(d,sdEll(ax,y,z,.07,.92,-.055,.085,.085,.07),.04);
    d=smin(d,sdCone(ax,y,z,[.0,1.56,-.01],[.17,1.515,-.01],.055,.045),.05);
    d=smin(d,sdEll(ax,y,z,.19,1.49,0,.06,.06,.058),.04);
    d=smin(d,sdEll(ax,y,z,.085,1.3,-.07,.06,.12,.04),.04);
  }
  if(y>1.45){
    d=smin(d,sdCone(x,y,z,[0,1.52,-.005],[0,1.7,.0],.052,.047),.04);
    if(y>1.6){
      let hd=sdEll(x,y,z,0,1.8,-.012,.083,.104,.098);
      hd=smin(hd,sdEll(x,y,z,0,1.725,.028,.066,.075,.075),.03);
      hd=smin(hd,sdEll(x,y,z,0,1.672,.06,.034,.026,.03),.025);
      hd=smin(hd,sdCone(ax,y,z,[.06,1.685,0],[.025,1.662,.055],.014,.012),.02);
      hd=smin(hd,sdEll(ax,y,z,.047,1.748,.06,.024,.018,.022),.02);
      hd=smin(hd,sdCone(x,y,z,[0,1.79,.083],[0,1.74,.107],.011,.0075),.012);
      hd=smin(hd,sdEll(x,y,z,0,1.737,.098,.016,.013,.014),.01);
      hd=smin(hd,sdEll(ax,y,z,.012,1.733,.094,.009,.008,.008),.006);
      hd=smin(hd,sdCone(ax,y,z,[.012,1.8,.088],[.052,1.802,.077],.008,.006),.012);
      hd=smin(hd,sdEll(x,y,z,0,1.708,.091,.022,.0075,.01),.006);
      hd=smin(hd,sdEll(x,y,z,0,1.695,.088,.019,.0085,.01),.006);
      hd=smax(hd,-sdEll(x,y,z,0,1.7015,.1,.02,.0018,.02),.002);
      hd=smax(hd,-sdEll(ax,y,z,.032,1.772,.088,.019,.0125,.016),.007);
      hd=smin(hd,sdEll(ax,y,z,.084,1.765,-.008,.011,.029,.019),.008);
      d=smin(d,hd,.02);
    }
  }
  if(ax>.12&&y>.68){
    const s=sx,S=armPt(s,0),E=armPt(s,.28),Wr=armPt(s,.54);
    let a=sdCone(x,y,z,S,E,.05,.039);
    const B=armPt(s,.14);a=smin(a,sdEll(x,y,z,B[0],B[1],.012,.042,.075,.043),.03);
    a=smin(a,sdCone(x,y,z,E,Wr,.039,.026),.02);
    const F=armPt(s,.34);a=smin(a,sdEll(x,y,z,F[0],F[1],.003,.04,.065,.037),.03);
    const H=armPt(s,.62),T=armPt(s,.72);
    a=smin(a,sdEll(x,y,z,H[0],H[1],.004,.024,.048,.04),.015);
    a=smin(a,sdCone(x,y,z,H,T,.019,.014),.015);
    const Th=armPt(s,.59);a=smin(a,sdCone(x,y,z,[Th[0],Th[1],.03],[Th[0]+s*.004,Th[1]-.045,.05],.011,.009),.01);
    d=smin(d,a,.035);
  }
  if(y<1.02){
    const s=sx,X=s*.098;
    let l=sdCone(x,y,z,[X,.92,0],[X,.47,.005],.082,.052);
    l=smin(l,sdEll(x,y,z,X+s*.012,.74,.012,.07,.15,.07),.04);

/* ---------- narration script (also drives the on-screen captions) ---------- */
const LINES=[
  [0.2,3.3,"This man just accidentally swallowed his chewing gum."],
  [3.6,6.9,"People say it stays inside you for seven years."],
  [7.1,12.0,"That's a myth. Stomach acid dissolves the sugar, but not the rubbery gum base."],
  [12.2,17.8,"So your intestines squeeze it along like a conveyor belt, just like everything else you eat."],

window.__lines=LINES;
const CHUNKS=[];
LINES.forEach(([a,b,txt])=>{const words=txt.split(' ');const wl=words.map(w=>w.replace(/[^\w%]/g,'').length+2);const tot=wl.reduce((s,v)=>s+v,0);
  let acc=a;const timed=words.map((w,i)=>{const s=acc;acc+=(b-a)*wl[i]/tot;return{w,s,e:acc};});
  for(let i=0;i<timed.length;){let n=3;if(timed.length-i===4)n=2;const ch=timed.slice(i,i+n);CHUNKS.push({words:ch,s:ch[0].s,e:ch[ch.length-1].e});i+=n;}});
let capKey='';
function updateCaption(t){const c=CHUNKS.find((c,i)=>t>=c.s&&(t<(CHUNKS[i+1]?CHUNKS[i+1].s:c.e+.3))&&t<c.e+.3);const el=$('cap');
  if(!c){if(capKey){el.innerHTML='';capKey='';}return;}
  const active=c.words.findIndex(w=>t>=w.s&&t<w.e);const k=c.s+':'+active;if(k===capKey)return;capKey=k;
  el.innerHTML=c.words.map((w,i)=>`<span class="${i===active?'on':''}">${w.w}</span>`).join(' ');}

/* ---------- timeline ---------- */
const CUTS=[3.5,7.0,12.0,18.0,23.0,27.2];
const isXray=t=>t>=3.5&&t<27.2;
function gumState(t){ // position + which tube it is inside
  if(t<3.5)return null;
  if(t<6.7)return{p:Ecurve.getPointAt(Math.pow(seg(t,3.5,6.7),.9)),tube:'e',u:seg(t,3.5,6.7)};
  if(t<12.0){const p=POOL.clone();p.y+=.004*Math.sin(t*3.1);p.x+=.004*Math.sin(t*1.7);return{p,tube:'s'};}
  if(t<12.6)return{p:POOL.clone().lerp(Scurve.getPointAt(0),ease(seg(t,12.0,12.6))),tube:'s'};
  if(t<17.8){const u=seg(t,12.6,17.8);return{p:Scurve.getPointAt(u),tube:'si',u};}
  if(t<21.3){const u=ease(seg(t,17.8,21.3));return{p:Lcurve.getPointAt(u),tube:'li',u};}
  return null;
}
function cam(t){
  let pos,tgt,fov,ap;const g=gumState(t);
  if(t<3.5){const k=ease(seg(t,0,3.5));pos=V(lerp(.62,.36,k),lerp(1.7,1.74,k),lerp(1.5,1.02,k));tgt=V(0,lerp(1.66,1.72,k),0);fov=34;ap=.004;}

  else if(t<12){const k=ease(seg(t,7,12));const c=V(.03,1.215,.015);pos=c.clone().add(V(lerp(.12,.04,k),lerp(.05,.02,k),lerp(.46,.3,k)));tgt=c;fov=32;ap=.004;}
  else if(t<18){const k=seg(t,12,18);const c=g.p.clone();c.z=.03;pos=c.clone().add(V(lerp(.06,-.04,k),.06,lerp(.42,.36,k)));tgt=c;fov=34;ap=.003;}
  else if(t<23){const k=ease(seg(t,18,23));pos=V(lerp(.25,-.1,k),lerp(1.12,1.08,k),lerp(.75,1.25,k));tgt=V(0,lerp(1.07,1.05,k),0);fov=36;ap=.0015;}
  else if(t<27.2){const k=ease(seg(t,23,27.2));pos=V(lerp(.2,.1,k),lerp(1.42,1.26,k),lerp(.95,.5,k));tgt=V(.02,lerp(1.36,1.21,k),0);fov=34;ap=.003;}
  else{const k=ease(seg(t,27.2,30));pos=V(lerp(1.9,2.2,k),lerp(1.25,1.3,k),lerp(2.5,2.9,k));tgt=V(.36,.98,.2);fov=36;ap=.002;}
  pos.x+=Math.sin(t*1.3)*.006;pos.y+=Math.sin(t*1.7)*.005;
  return{pos,tgt,fov,ap};
}
let modeX=null;
function setMode(x){if(x===modeX)return;modeX=x;
  swapables.forEach(([o,mat])=>{o.material=x?xrayMat:mat;o.castShadow=!x;});
  inter.forEach(o=>o.visible=false);organs.visible=x;floor.visible=!x;bin.visible=!x;
  bgU.uTop.value.copy((x?VOID:STUDIO)[0]);bgU.uBot.value.copy((x?VOID:STUDIO)[1]);scene.fog.far=x?9999:26;scene.fog.near=x?9000:5;}

function renderAt(t){
  t=clamp(t,0,DUR);
  updateCaption(t);
  if(LAYER_CAP)return;
  const x=isXray(t);setMode(x);
  // --- acting
  let pose=P.relaxed;
  if(x)pose=P.neutral;else if(t>=27.2)pose=lerpPose(P.relaxed,P.spit,ease(seg(t,27.4,27.9))*(1-ease(seg(t,28.1,28.9))));
  applyPose(pose,t);
  const gulp=win(t,2.75,3.4,.22);
  J.head.rotation.x=pose.hd-gulp*.22+(t<2.5?Math.sin(t*9)*.012:0);
  J.head.rotation.y=t>=27.2?.5*ease(seg(t,27.2,27.7)):(t<3.5?.12:0);
  J.spine.rotation.y=t>=27.2?.25*ease(seg(t,27.2,27.7)):0;
  const bl=[.5,2.62,28.5].some(b=>t>b&&t<b+.12);lids.forEach(l=>{if(l.userData.rx!==undefined)l.rotation.x=bl?1.5:l.userData.rx;});
  scene.updateMatrixWorld(true);
  const mouthW=J.head.localToWorld(MOUTH.clone().sub(V(...RP.head)));
  // --- bubble + pop
  const bk=seg(t,.45,2.5);const br=.004+.058*Math.pow(bk,1.6)*(1+.03*Math.sin(t*23));
  bubble.visible=!x&&t>.45&&t<2.5;bubble.scale.set(br,br*(1+.04*Math.sin(t*17)),br);bubble.position.copy(mouthW).add(V(0,-.004,br*.9));
  shreds.forEach(s=>{const k=seg(t,2.5,2.95);s.visible=!x&&t>=2.5&&t<2.95;if(s.visible){s.position.copy(mouthW).add(s.userData.d.clone().multiplyScalar(.02+k*.16*s.userData.s)).add(V(0,-.25*k*k,.05));s.rotation.set(s.userData.r+k*9,s.userData.r*2+k*7,0);s.material.opacity=1-k;}});
  // --- gum
  const g=gumState(t);let gv=false;
  if(g){gv=true;gum.position.copy(g.p);}
  if(t>=27.9&&t<28.75){gv=true;const k=seg(t,27.9,28.75);const a=mouthW.clone(),b=bin.position.clone().add(V(0,.12,0));gum.position.copy(a.lerp(b,k));gum.position.y+=.55*k*(1-k)+.0;}
  gum.visible=gv;const gs=x?.0115:.011;gum.scale.set(gs*(1+.1*Math.sin(t*14)),gs*(1-.1*Math.sin(t*14)),gs);gum.rotation.set(t*2.1,t*1.3,0);
  gumMat.emissiveIntensity=x?.75:0;gum.castShadow=!x;
  gumGlow.visible=x&&gv;if(gv)gumGlow.position.copy(gum.position);gumGlow.material.opacity=.55+.2*Math.sin(t*6);
  poof.visible=t>=21.3&&t<21.9;if(poof.visible){const k=seg(t,21.3,21.9);poof.position.copy(Lcurve.getPointAt(1));poof.scale.setScalar(.08+k*.35);poof.material.opacity=1-k;}
  // --- organs
  for(const m of[esoMat,smallMat,largeMat]){m.uniforms.uTime.value=t;m.uniforms.uGum.value=-1;m.uniforms.uBulge.value=0;}
  xrayMat.uniforms.uTime.value=t;filmPass.uniforms.uTime.value=t;
  esoMat.uniforms.uWave.value=.0008;smallMat.uniforms.uWave.value=(t>=12&&t<18)?.0026:.0012;largeMat.uniforms.uWave.value=.0022;
  if(g&&g.tube==='e'){esoMat.uniforms.uGum.value=clamp((Ecurve.getLength()*Math.pow(g.u,.9)-.045)/esoCurve.getLength(),-1,1.2);esoMat.uniforms.uBulge.value=.0045;esoMat.uniforms.uGN.value=16;}
  if(g&&g.tube==='si'){smallMat.uniforms.uGum.value=g.u;smallMat.uniforms.uBulge.value=.004;}
  if(g&&g.tube==='li'){largeMat.uniforms.uGum.value=g.u;largeMat.uniforms.uBulge.value=.003;}
  acidPlane.constant=1.228+.0015*Math.sin(t*2.3);
  const fizz=(t>=6.6&&t<12)||(t>=23.6&&t<27.2);
  bubbles.forEach(b=>{const k=(t*b.userData.sp*.55+b.userData.o)%1;b.visible=x&&fizz;if(b.visible){b.position.set(b.userData.x+.003*Math.sin(t*5+b.userData.o*9),1.165+k*.062,b.userData.z);b.material.opacity=(1-k)*.8*(stomachSDF(b.position.x,b.position.y,b.position.z)<-.004?1:0);}});
  foods.forEach(f=>{const k=seg(t,f.userData.t0,f.userData.t0+1.9);const on=x&&t>=6.9&&t<12&&k<1;f.visible=on;if(on){f.position.copy(f.userData.p);f.position.y+=.003*Math.sin(t*2.5+f.userData.r);f.scale.setScalar(1-k);f.rotation.set(t+f.userData.r,t*.7,0);f.material.opacity=.9*(1-k*.5)*seg(t,6.9,7.3);}});
  // --- too many at once
  const danger=seg(t,25.3,26.2);
  const cCenter=POOL.clone().lerp(V(.018,1.186,.02),ease(seg(t,24.9,25.8)));
  clump.forEach(m=>{const on=x&&t>=m.userData.t0&&t<27.2;m.visible=on;if(on){const k=seg(t,m.userData.t0,m.userData.t0+.95);
    const tgt=cCenter.clone().add(m.userData.off);if(k<1){m.position.copy(Ecurve.getPointAt(k*.93)).lerp(tgt,Math.pow(k,6));}else m.position.copy(tgt);
    m.scale.set(.0112,.0098,.0112);m.rotation.set(m.userData.rot,m.userData.rot*2,0);}});
  const pulse=.5+.5*Math.sin(t*11);
  clumpMat.emissive.setRGB(1,lerp(.18,.02,danger),lerp(.56,.05,danger));clumpMat.emissiveIntensity=.7+danger*pulse*.9;
  stomachMat.uniforms.uColor.value.setRGB(1,lerp(.56,.2,danger*pulse),lerp(.5,.18,danger*pulse));
  dangerGlow.visible=x&&danger>0&&t<27.2;dangerGlow.position.copy(cCenter);dangerGlow.material.opacity=danger*(.35+.4*pulse);
  // heart
  {const ph=(t*1.2)%1;heart.scale.setScalar(.85*(1+.1*Math.exp(-Math.pow((ph-.3)/.07,2))));}
  // --- camera + lens
  const c=cam(t);camera.position.copy(c.pos);camera.lookAt(c.tgt);camera.fov=c.fov;camera.updateProjectionMatrix();
  bokeh.uniforms.focus.value=c.pos.distanceTo(c.tgt);bokeh.uniforms.aperture.value=c.ap;bokeh.uniforms.maxblur.value=.01;
  bloom.strength=!x?.22:(t>=12&&t<18)?.3:.55;bloom.threshold=x?.6:.9;renderer.toneMappingExposure=x?1.25:1.05;
  composer.render();
  // --- overlays
  let fl=0;CUTS.forEach(cu=>fl+=Math.exp(-Math.abs(t-cu)*20));fl+=.5*Math.exp(-Math.abs(t-2.5)*30);
  $('flash').style.opacity=clamp(fl*.55,0,.7);
  const st=$('stat');let sv=0;
  if(t>=4.3&&t<6.9){sv=win(t,4.3,6.9,.22);st.querySelector('.n').textContent=Math.round(7*eo(seg(t,4.3,5.3)))+' YEARS?';st.querySelector('.l').textContent='STUCK IN YOUR STOMACH';st.className='';}
  else if(t>=19.2&&t<22.8){sv=win(t,19.2,22.8,.22);st.querySelector('.n').textContent='2 – 4 DAYS';st.querySelector('.l').textContent='AND IT IS OUT';st.className='good';}
  st.style.opacity=sv;st.style.transform=`scale(${.9+.1*eo(clamp(sv))})`;
  const tag=$('tag');let tv=0;tag.className='';
  if(t>=7.15&&t<9.2){tv=win(t,7.15,9.2,.2);tag.innerHTML='MYTH <i>BUSTED</i>';}
  else if(t>=9.6&&t<11.9){tv=win(t,9.6,11.9,.2);tag.innerHTML='GUM BASE <i>CAN’T BE DIGESTED</i>';}
  else if(t>=13&&t<17.6){tv=win(t,13,17.6,.2);tag.innerHTML='SMALL INTESTINE · <i>6 METRES</i>';}
  else if(t>=25.4&&t<27.1){tv=win(t,25.4,27.1,.2);tag.innerHTML='<i>BLOCKAGE</i>';tag.className='danger';}
  tag.style.opacity=tv;
  $('end').style.opacity=seg(t,29.0,29.35);$('fade').style.opacity=.3*seg(t,29.0,29.35);
}

/* ---------- playback (silent film) ---------- */
let t=0,playing=false,last=0;const playBtn=$('play'),seek=$('seek'),timeEl=$('time');
playBtn.onclick=()=>{playing=!playing;if(playing&&t>=DUR)t=0;last=performance.now();playBtn.textContent=playing?'PAUSE':'PLAY';};
seek.oninput=()=>{t=+seek.value;};
function loop(now){if(playing){t+=Math.min(.1,(now-last)/1000);if(t>=DUR){t=DUR;playing=false;playBtn.textContent='REPLAY';}}last=now;
  renderAt(t);seek.value=t;timeEl.textContent=t.toFixed(1)+' / 30.0';requestAnimationFrame(loop);}
window.__render=s=>{renderAt(s);return true;};
resize();addEventListener('resize',resize);renderAt(0);$('loading').hidden=true;window.__ready=true;
if(!CAPTURE)requestAnimationFrame(loop);
</script>
