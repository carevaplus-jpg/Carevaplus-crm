<script type="module">

import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const DUR=30;
const CAPTURE=/capture/.test(location.search);

const $=id=>document.getElementById(id);
const stage=$('stage');

/* ---------- helpers ---------- */

const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- SDF toolkit + surface-nets mesher ---------- */

function surfaceNets(sdf,mn,mx,h){

  const cid=(i,j,k)=>i+(nx-1)*(j+(ny-1)*k);

  const val=new Float32Array(8);
  for(let k=0;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    let m=0;
    for(let c=0;c<8;c++){const v=F[(i+(c&1))+nx*((j+((c>>1)&1))+ny*(k+((c>>2)&1)))];val[c]=v;if(v<0)m|=1<<c;}

  }

  const quad=(a,b,c,d)=>{if(a<0||b<0||c<0||d<0)return;idx.push(a,b,c,a,c,d);};
  for(let k=1;k<nz-1;k++)for(let j=1;j<ny-1;j++)for(let i=1;i<nx-1;i++){
    const in0=F[i+nx*(j+ny*k)]<0;

    if(in0!==(F[i+nx*(j+1+ny*k)]<0))quad(cellV[cid(i-1,j,k-1)],cellV[cid(i-1,j,k)],cellV[cid(i,j,k)],cellV[cid(i,j,k-1)]);
    if(in0!==(F[i+nx*(j+ny*(k+1))]<0))quad(cellV[cid(i-1,j-1,k)],cellV[cid(i,j-1,k)],cellV[cid(i,j,k)],cellV[cid(i-1,j,k)]);

      let gx=sdf(x+e,y,z)-sdf(x-e,y,z),gy=sdf(x,y+e,z)-sdf(x,y-e,z),gz=sdf(x,y,z+e)-sdf(x,y,z-e);const l=Math.hypot(gx,gy,gz)||1;gx/=l;gy/=l;gz/=l;

  }

    const cx=uy*wz-uz*wy,cy=uz*wx-ux*wz,cz=ux*wy-uy*wx;
    if(cx*(N[a]+N[b]+N[c])+cy*(N[a+1]+N[b+1]+N[c+1])+cz*(N[a+2]+N[b+2]+N[c+2])<0){const s=idx[t+1];idx[t+1]=idx[t+2];idx[t+2]=s;}}

/* ---------- renderer + post ---------- */

const bokeh=new BokehPass(scene,camera,{focus:3,aperture:.002,maxblur:.008});

  uniforms:{tDiffuse:{value:null},uTime:{value:0},uGrain:{value:.035},uVig:{value:.42},uCA:{value:.004}},

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight,dpr=CAPTURE?2:Math.min(devicePixelRatio||1,1.5);
  renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);
  composer.setPixelRatio(dpr);composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  stage.style.setProperty('--u',(w/100)+'px');
  const hud=$('hud');hud.width=w*dpr;hud.height=h*dpr;
}

/* ---------- fresnel material (x-ray + flashover); works on skinned and plain meshes ---------- */
function fresnelMat(color,base,power,inflate=0){
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uColor:{value:new THREE.Color(color)},uBase:{value:base},uPow:{value:power},uSweep:{value:-9},uAmp:{value:1},uTime:{value:0},uInflate:{value:inflate}},
    vertexShader:`#include <common>
      #include <skinning_pars_vertex>
      uniform float uInflate;varying vec3 vN,vV;varying float vY;
      void main(){
        #include <beginnormal_vertex>
        #include <skinbase_vertex>
        #include <skinnormal_vertex>
        #include <begin_vertex>
        #include <skinning_vertex>
        transformed+=normalize(objectNormal)*uInflate;
        vec4 w=modelMatrix*vec4(transformed,1.);vY=w.y;vec4 mv=viewMatrix*w;
        vN=normalize(normalMatrix*objectNormal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform vec3 uColor;uniform float uBase,uPow,uSweep,uAmp,uTime;varying vec3 vN,vV;varying float vY;
      void main(){float fr=pow(1.-abs(dot(normalize(vN),normalize(vV))),uPow);
      float band=exp(-pow((vY-uSweep)*5.,2.));
      float fl=.75+.25*sin(vY*90.+uTime*70.);
      float a=(uBase+fr)*uAmp+band*1.6*fl*step(.001,uAmp);
      gl_FragColor=vec4(uColor*a,1.);}`
  });

const xrayMat=fresnelMat(0x58b6ff,.025,2.4);
const shellMat=fresnelMat(0x9fd8ff,0,2.5,.012);shellMat.uniforms.uAmp.value=0;

let SKYROT=0,BLINK_UP=.4,BLINK_LO=.15,EXPO=1.0;
/* ================= SWALLOWED GUM: film ================= */
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {GroundProjectedSkybox} from 'three/addons/objects/GroundProjectedSkybox.js';
renderer.localClippingEnabled=true;
const LAYER_CAP=/layer=cap/.test(location.search);
if(LAYER_CAP)document.body.classList.add('caplayer');
function meshFromSDF(sdf,mn,mx,h){const {P,N,idx}=surfaceNets(sdf,mn,mx,h);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(N,3));g.setIndex(idx);return g;}
const LM=await (await fetch('assets/man.json')).json();
const [gltf,hdr,bgTex]=await Promise.all([new GLTFLoader().loadAsync('assets/man.glb'),new RGBELoader().loadAsync('assets/street_2k.hdr'),new THREE.TextureLoader().loadAsync('assets/street_8k.jpg')]);

/* ---------- real environment: photographed street, ground-projected ---------- */
hdr.mapping=THREE.EquirectangularReflectionMapping;
{const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(hdr).texture;}
bgTex.colorSpace=THREE.SRGBColorSpace;bgTex.mapping=THREE.EquirectangularReflectionMapping;bgTex.anisotropy=8;bgTex.minFilter=THREE.LinearFilter;bgTex.generateMipmaps=false;
const skybox=new GroundProjectedSkybox(bgTex,{height:1.9,radius:40});skybox.scale.setScalar(40);
{const m=skybox.material;m.uniforms.uRot={value:0};m.uniforms.uDim={value:1};
 m.fragmentShader=m.fragmentShader.replace('uniform float height;','uniform float height;uniform float uRot,uDim;')
  .replace('vec3 direction = normalize( projectedWorldPosition );','vec3 d0 = normalize( projectedWorldPosition );float cR=cos(uRot),sR=sin(uRot);vec3 direction=vec3(cR*d0.x-sR*d0.z,d0.y,sR*d0.x+cR*d0.z);')
  .replace('gl_FragColor = vec4( outcolor, 1.0 );','gl_FragColor = vec4( pow(outcolor,vec3(1.12))*uDim, 1.0 );');

scene.fog=null;
const key=new THREE.DirectionalLight(0xfff4e6,1.5);key.position.set(2.5,6,3.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=10;key.shadow.blurSamples=16;
Object.assign(key.shadow.camera,{left:-2,right:2,top:2.4,bottom:-.5,near:.5,far:20});key.shadow.bias=-.0004;key.shadow.normalBias=.012;scene.add(key);
const rimL=new THREE.DirectionalLight(0xdfeaff,.7);rimL.position.set(-3,3,-4);scene.add(rimL);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.ShadowMaterial({opacity:.38}));floor.rotation.x=-Math.PI/2;floor.position.y=.002;floor.receiveShadow=true;scene.add(floor);
const blobTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const blob=new THREE.Mesh(new THREE.PlaneGeometry(.9,.6),new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.set(0,.004,.03);scene.add(blob);
const bin=new THREE.Group();{const m=new THREE.MeshStandardMaterial({color:0x30353c,roughness:.3,metalness:.85,side:THREE.DoubleSide});
 const w=new THREE.Mesh(new THREE.CylinderGeometry(.17,.14,.5,48,1,true),m);w.position.y=.25;w.castShadow=true;
 const b=new THREE.Mesh(new THREE.CircleGeometry(.14,40),m);b.rotation.x=-Math.PI/2;b.position.y=.005;
 const r=new THREE.Mesh(new THREE.TorusGeometry(.17,.01,8,48),m);r.rotation.x=Math.PI/2;r.position.y=.5;
 const bb=new THREE.Mesh(new THREE.PlaneGeometry(.6,.6),blob.material);bb.rotation.x=-Math.PI/2;bb.position.y=.004;bin.add(w,b,r,bb);}
bin.position.set(.85,0,.75);scene.add(bin);

/* ---------- character: MakeHuman body, skin, clothes, hair, 163-bone rig ---------- */
const SCL=1.7015/LM.mouth[1];
const human=gltf.scene;human.scale.setScalar(SCL);scene.add(human);

  let fl=0;CUTS.forEach(cu=>fl+=Math.exp(-Math.abs(t-cu)*20));fl+=.5*Math.exp(-Math.abs(t-2.5)*30);
  $('flash').style.opacity=clamp(fl*.55,0,.7);
  const st=$('stat');let sv=0;
  if(t>=4.3&&t<6.9){sv=win(t,4.3,6.9,.22);st.querySelector('.n').textContent=Math.round(7*eo(seg(t,4.3,5.3)))+' YEARS?';st.querySelector('.l').textContent='STUCK IN YOUR STOMACH';st.className='';}
  else if(t>=19.2&&t<22.8){sv=win(t,19.2,22.8,.22);st.querySelector('.n').textContent='2 – 4 DAYS';st.querySelector('.l').textContent='AND IT IS OUT';st.className='good';}
  st.style.opacity=sv;st.style.transform=`scale(${.9+.1*eo(clamp(sv))})`;
  const tag=$('tag');let tv=0;tag.className='';
  if(t>=7.15&&t<9.2){tv=win(t,7.15,9.2,.2);tag.innerHTML='MYTH <i>BUSTED</i>';}
  else if(t>=9.6&&t<11.9){tv=win(t,9.6,11.9,.2);tag.innerHTML='GUM BASE <i>CAN’T BE DIGESTED</i>';}
  else if(t>=13&&t<17.6){tv=win(t,13,17.6,.2);tag.innerHTML='SMALL INTESTINE · <i>6 METRES</i>';}
  else if(t>=25.4&&t<27.1){tv=win(t,25.4,27.1,.2);tag.innerHTML='<i>BLOCKAGE</i>';tag.className='danger';}
  tag.style.opacity=tv;
  $('end').style.opacity=seg(t,29.0,29.35);$('fade').style.opacity=.3*seg(t,29.0,29.35);
}

/* ---------- playback (silent film) ---------- */
let t=0,playing=false,last=0;const playBtn=$('play'),seek=$('seek'),timeEl=$('time');
playBtn.onclick=()=>{playing=!playing;if(playing&&t>=DUR)t=0;last=performance.now();playBtn.textContent=playing?'PAUSE':'PLAY';};
seek.oninput=()=>{t=+seek.value;};
function loop(now){if(playing){t+=Math.min(.1,(now-last)/1000);if(t>=DUR){t=DUR;playing=false;playBtn.textContent='REPLAY';}}last=now;
  renderAt(t);seek.value=t;timeEl.textContent=t.toFixed(1)+' / 30.0';requestAnimationFrame(loop);}
window.__render=s=>{renderAt(s);return true;};
window.__set=(k,v)=>{if(k==='rot')SKYROT=v;if(k==='bu')BLINK_UP=v;if(k==='bl')BLINK_LO=v;if(k==='expo')EXPO=v;};
resize();addEventListener('resize',resize);renderAt(0);$('loading').hidden=true;window.__ready=true;
if(!CAPTURE)requestAnimationFrame(loop);
</script>
